<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CO₂ Emissions Monitor — Industrial Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.46.0/dist/apexcharts.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Space+Mono:wght@400;700&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet">

<style>
/* ═══════════════════════════════════════════════════════
   CO2 EMISSIONS MONITOR — GLOBAL DESIGN SYSTEM
   Aesthetic: Industrial Precision / Dark Technical
   ═══════════════════════════════════════════════════════ */
:root {
  --bg-base:      #080c10;
  --bg-surface:   #0d1117;
  --bg-card:      #111820;
  --bg-elevated:  #161e28;
  --bg-hover:     #1c2530;
  --border:       #1e2d3d;
  --border-light: #243040;
  --text-primary:   #e8edf2;
  --text-secondary: #7a92a8;
  --text-muted:     #3d5166;
  --accent-cyan:   #00d4ff;
  --accent-green:  #00ff9d;
  --accent-orange: #ff8c42;
  --accent-red:    #ff3b5c;
  --accent-yellow: #ffd166;
  --status-normal:  #22c55e;
  --status-warning: #f59e0b;
  --status-danger:  #ef4444;
  --font-display: 'Syne', sans-serif;
  --font-mono:    'Space Mono', monospace;
  --font-body:    'DM Sans', sans-serif;
  --nav-height: 64px;
  --sidebar-w: 240px;
  --radius-sm: 6px; --radius-md: 10px; --radius-lg: 16px;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 14px; scroll-behavior: smooth; }
body {
  background: var(--bg-base);
  color: var(--text-primary);
  font-family: var(--font-body);
  line-height: 1.6;
  min-height: 100vh;
  overflow-x: hidden;
}
body::before {
  content: '';
  position: fixed; inset: 0;
  background-image:
    repeating-linear-gradient(0deg,   transparent, transparent 39px, var(--border) 39px, var(--border) 40px),
    repeating-linear-gradient(90deg,  transparent, transparent 39px, var(--border) 39px, var(--border) 40px);
  opacity: 0.04;
  pointer-events: none; z-index: 0;
}
.app-shell { display: flex; min-height: 100vh; }
.sidebar {
  width: var(--sidebar-w); min-height: 100vh;
  background: var(--bg-surface); border-right: 1px solid var(--border);
  position: fixed; top: 0; left: 0;
  display: flex; flex-direction: column; z-index: 100;
  transition: transform 0.3s ease;
}
.sidebar-logo {
  padding: 20px 20px 18px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 12px;
}
.logo-icon {
  width: 36px; height: 36px;
  background: linear-gradient(135deg, #00d4ff, #00ff9d);
  border-radius: 8px; display: flex; align-items: center;
  justify-content: center; font-size: 18px; flex-shrink: 0;
}
.logo-text { font-family: var(--font-display); font-weight: 800; font-size: 1rem;
  letter-spacing: -0.02em; color: var(--text-primary); line-height: 1.2; }
.logo-text span { display: block; font-size: 0.62rem; font-weight: 400;
  color: var(--text-secondary); font-family: var(--font-body);
  letter-spacing: 0.05em; text-transform: uppercase; }
.sidebar-nav { padding: 12px 10px; flex: 1; }
.nav-section-label { font-size: 0.6rem; font-weight: 600; letter-spacing: 0.12em;
  text-transform: uppercase; color: var(--text-muted); padding: 12px 10px 6px;
  font-family: var(--font-mono); }
.nav-item {
  display: flex; align-items: center; gap: 10px; padding: 10px 12px;
  border-radius: var(--radius-sm); color: var(--text-secondary); text-decoration: none;
  font-size: 0.875rem; font-weight: 500; transition: all 0.18s ease; margin-bottom: 2px;
  cursor: pointer; border: 1px solid transparent; position: relative;
}
.nav-item:hover { background: var(--bg-hover); color: var(--text-primary); border-color: var(--border); }
.nav-item.active {
  background: linear-gradient(135deg, rgba(0,212,255,0.12), rgba(0,212,255,0.04));
  color: var(--accent-cyan); border-color: rgba(0,212,255,0.25);
}
.nav-item.active::before {
  content: ''; position: absolute; left: -10px; top: 50%; transform: translateY(-50%);
  width: 3px; height: 60%; background: var(--accent-cyan); border-radius: 0 3px 3px 0;
}
.nav-icon { font-size: 1rem; width: 20px; text-align: center; flex-shrink: 0; }
.sidebar-footer { padding: 16px; border-top: 1px solid var(--border); }
.live-badge { display: flex; align-items: center; gap: 8px;
  font-size: 0.7rem; color: var(--text-secondary); font-family: var(--font-mono); }
.live-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--status-normal); box-shadow: 0 0 8px var(--status-normal);
  animation: livePulse 2s ease-in-out infinite; flex-shrink: 0;
}
@keyframes livePulse {
  0%,100% { opacity:1; box-shadow: 0 0 8px var(--status-normal); }
  50%     { opacity:0.6; box-shadow: 0 0 16px var(--status-normal); }
}
.main-content { margin-left: var(--sidebar-w); flex: 1; min-height: 100vh; display: flex; flex-direction: column; }
.topbar {
  height: var(--nav-height); background: var(--bg-surface); border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 28px; position: sticky; top: 0; z-index: 50;
}
.page-title { font-family: var(--font-display); font-weight: 700; font-size: 1.1rem;
  color: var(--text-primary); letter-spacing: -0.02em; }
.page-subtitle { font-size: 0.72rem; color: var(--text-muted); font-family: var(--font-mono); }
.topbar-right { display: flex; align-items: center; gap: 14px; }
.topbar-time { font-family: var(--font-mono); font-size: 0.78rem; color: var(--accent-cyan);
  background: rgba(0,212,255,0.08); padding: 5px 10px; border-radius: var(--radius-sm);
  border: 1px solid rgba(0,212,255,0.2); }
.page-content { flex: 1; padding: 28px; position: relative; z-index: 1; }
/* CARDS */
.card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; }
.card-header { display: flex; align-items: center; justify-content: space-between;
  padding: 18px 22px 14px; border-bottom: 1px solid var(--border); }
.card-title { font-family: var(--font-display); font-weight: 700; font-size: 0.95rem;
  color: var(--text-primary); letter-spacing: -0.01em; }
.card-subtitle { font-size: 0.7rem; color: var(--text-muted); font-family: var(--font-mono); margin-top: 2px; }
.card-body { padding: 20px 22px; }
/* STAT CARDS */
.stat-card {
  background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-lg);
  padding: 20px; position: relative; overflow: hidden; transition: all 0.2s;
}
.stat-card:hover { border-color: var(--border-light); transform: translateY(-1px); }
.stat-card::before { content:''; position:absolute; top:0; right:0; width:80px; height:80px; border-radius:0 var(--radius-lg) 0 100%; opacity:0.06; }
.stat-card.cyan::before   { background: var(--accent-cyan); }
.stat-card.green::before  { background: var(--accent-green); }
.stat-card.orange::before { background: var(--accent-orange); }
.stat-card.red::before    { background: var(--accent-red); }
.stat-label { font-size:0.65rem; text-transform:uppercase; letter-spacing:0.1em;
  color:var(--text-muted); font-family:var(--font-mono); margin-bottom:10px; }
.stat-value { font-family:var(--font-mono); font-size:1.85rem; font-weight:700;
  color:var(--text-primary); line-height:1; margin-bottom:6px; letter-spacing:-0.02em; }
.stat-value.cyan   { color: var(--accent-cyan);   }
.stat-value.green  { color: var(--accent-green);  }
.stat-value.orange { color: var(--accent-orange); }
.stat-value.red    { color: var(--accent-red);    }
.stat-delta { font-size:0.72rem; color:var(--text-secondary); font-family:var(--font-mono); }
.stat-icon { position:absolute; top:16px; right:18px; font-size:1.4rem; opacity:0.35; }
/* BADGE */
.badge { display:inline-flex; align-items:center; gap:5px; padding:3px 9px;
  border-radius:20px; font-size:0.65rem; font-weight:700; font-family:var(--font-mono);
  text-transform:uppercase; letter-spacing:0.08em; }
.badge::before { content:''; width:5px; height:5px; border-radius:50%; background:currentColor; }
.badge.normal  { background:rgba(34,197,94,0.15);  color:var(--status-normal);  border:1px solid rgba(34,197,94,0.3); }
.badge.warning { background:rgba(245,158,11,0.15); color:var(--status-warning); border:1px solid rgba(245,158,11,0.3);}
.badge.danger  { background:rgba(239,68,68,0.15);  color:var(--status-danger);  border:1px solid rgba(239,68,68,0.3); }
/* ALERT */
.alert-strip {
  background:rgba(255,59,92,0.08); border:1px solid rgba(255,59,92,0.25);
  border-radius:var(--radius-md); padding:12px 18px;
  display:flex; align-items:center; gap:12px; font-size:0.8rem; color:#ff8fa8; margin-bottom:20px;
  animation: alertPulse 3s ease-in-out infinite;
}
@keyframes alertPulse { 0%,100%{border-color:rgba(255,59,92,0.25)} 50%{border-color:rgba(255,59,92,0.5)} }
/* BUTTONS */
.btn { display:inline-flex; align-items:center; gap:7px; padding:8px 16px; border-radius:var(--radius-sm);
  font-size:0.78rem; font-weight:500; font-family:var(--font-body); cursor:pointer;
  transition:all 0.18s; text-decoration:none; border:none; white-space:nowrap; }
.btn-primary { background:linear-gradient(135deg,#00d4ff,#0099bb); color:#000; font-weight:700;
  box-shadow:0 4px 14px rgba(0,212,255,0.3); }
.btn-primary:hover { box-shadow:0 6px 20px rgba(0,212,255,0.45); transform:translateY(-1px); }
.btn-ghost { background:transparent; color:var(--text-secondary); border:1px solid var(--border); }
.btn-ghost:hover { background:var(--bg-hover); color:var(--text-primary); border-color:var(--border-light); }
.btn-sm { padding:5px 11px; font-size:0.72rem; }
/* FORM */
.form-group { display:flex; flex-direction:column; gap:5px; }
.form-label { font-size:0.65rem; text-transform:uppercase; letter-spacing:0.08em; color:var(--text-muted); font-family:var(--font-mono); }
.form-control { background:var(--bg-surface); border:1px solid var(--border); border-radius:var(--radius-sm);
  color:var(--text-primary); padding:8px 12px; font-size:0.82rem; font-family:var(--font-body);
  width:100%; transition:border-color 0.18s; }
.form-control:focus { outline:none; border-color:var(--accent-cyan); box-shadow:0 0 0 3px rgba(0,212,255,0.1); }
select.form-control option { background: var(--bg-card); }
/* DATA TABLE */
.data-table-wrap { overflow-x:auto; border-radius:var(--radius-md); }
.data-table { width:100%; border-collapse:collapse; font-size:0.8rem; }
.data-table thead tr { background:var(--bg-surface); border-bottom:1px solid var(--border); }
.data-table th { padding:11px 14px; text-align:left; font-family:var(--font-mono); font-size:0.62rem;
  text-transform:uppercase; letter-spacing:0.09em; color:var(--text-muted); white-space:nowrap;
  cursor:pointer; user-select:none; transition:color 0.15s; }
.data-table th:hover { color: var(--accent-cyan); }
.data-table th.sort-asc::after  { content:' ↑'; color:var(--accent-cyan); }
.data-table th.sort-desc::after { content:' ↓'; color:var(--accent-cyan); }
.data-table tbody tr { border-bottom:1px solid var(--border); transition:background 0.15s; }
.data-table tbody tr:hover { background:var(--bg-hover); }
.data-table td { padding:11px 14px; color:var(--text-secondary); vertical-align:middle; }
.data-table td.mono { font-family:var(--font-mono); color:var(--text-primary); }
/* PAGINATION */
.pagination { display:flex; align-items:center; gap:4px; justify-content:flex-end; padding-top:16px; }
.pg-btn { width:30px; height:30px; display:flex; align-items:center; justify-content:center;
  border-radius:var(--radius-sm); background:transparent; border:1px solid var(--border);
  color:var(--text-secondary); font-size:0.75rem; cursor:pointer; transition:all 0.15s;
  font-family:var(--font-mono); }
.pg-btn:hover { background:var(--bg-hover); color:var(--text-primary); }
.pg-btn.active { background:rgba(0,212,255,0.15); border-color:var(--accent-cyan); color:var(--accent-cyan); }
.pg-btn:disabled { opacity:0.3; cursor:not-allowed; }
/* FACILITY CARDS */
.facility-card { background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius-lg);
  padding:18px 20px; transition:all 0.2s; position:relative; overflow:hidden; }
.facility-card:hover { border-color:var(--border-light); transform:translateY(-2px); box-shadow:0 8px 30px rgba(0,0,0,0.4); }
.facility-card::after { content:''; position:absolute; bottom:0; left:0; right:0; height:3px; }
.facility-card.status-NORMAL::after  { background:var(--status-normal); }
.facility-card.status-WARNING::after { background:var(--status-warning); }
.facility-card.status-DANGER::after  { background:var(--status-danger); }
.facility-header { display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:16px; }
.facility-name { font-family:var(--font-display); font-weight:700; font-size:0.95rem; color:var(--text-primary); }
.facility-loc { font-size:0.7rem; color:var(--text-muted); font-family:var(--font-mono); margin-top:2px; }
.facility-ppm { font-family:var(--font-mono); font-size:2rem; font-weight:700; letter-spacing:-0.03em; line-height:1; }
.facility-ppm.NORMAL  { color:var(--status-normal); }
.facility-ppm.WARNING { color:var(--status-warning);}
.facility-ppm.DANGER  { color:var(--status-danger); }
.facility-sub { font-size:0.65rem; color:var(--text-muted); font-family:var(--font-mono); margin-top:2px; }
.mini-stats { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:14px; }
.mini-stat { background:var(--bg-surface); border:1px solid var(--border); border-radius:var(--radius-sm); padding:8px 10px; }
.mini-stat-label { font-size:0.58rem; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.08em; font-family:var(--font-mono); }
.mini-stat-val { font-family:var(--font-mono); font-size:0.85rem; font-weight:700; color:var(--text-primary); margin-top:2px; }
.progress-bar-wrap { background:var(--bg-surface); border-radius:99px; height:5px; margin-top:10px; overflow:hidden; }
.progress-bar-fill { height:100%; border-radius:99px; transition:width 0.6s ease; }
/* GRID */
.grid-4 { display:grid; grid-template-columns:repeat(4,1fr); gap:16px; }
.grid-3 { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; }
.grid-2 { display:grid; grid-template-columns:repeat(2,1fr); gap:16px; }
.mb-20 { margin-bottom:20px; } .mb-24 { margin-bottom:24px; } .mb-28 { margin-bottom:28px; }
.section-header { display:flex; align-items:flex-end; justify-content:space-between; margin-bottom:16px; }
.section-title { font-family:var(--font-display); font-weight:700; font-size:1.05rem; color:var(--text-primary); letter-spacing:-0.02em; }
.section-meta { font-size:0.7rem; color:var(--text-muted); font-family:var(--font-mono); margin-top:2px; }
/* SCROLLBAR */
::-webkit-scrollbar { width:5px; height:5px; }
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:var(--border); border-radius:99px; }
/* APEX OVERRIDES */
.apexcharts-tooltip { background:var(--bg-elevated)!important; border:1px solid var(--border-light)!important;
  border-radius:var(--radius-md)!important; color:var(--text-primary)!important; }
.apexcharts-tooltip-title { background:var(--bg-surface)!important; border-bottom:1px solid var(--border)!important;
  color:var(--text-primary)!important; font-family:var(--font-mono)!important; font-size:0.72rem!important; }
.apexcharts-menu { background:var(--bg-elevated)!important; border:1px solid var(--border)!important; }
.apexcharts-menu-item:hover { background:var(--bg-hover)!important; }
/* FILTER BAR */
.filter-bar { background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius-lg);
  padding:16px 20px; margin-bottom:20px; display:flex; flex-wrap:wrap; gap:12px; align-items:flex-end; }
.filter-bar .form-group { min-width:120px; flex:1; }
/* PAGE ANIMATION */
.page { display:none; animation: fadeIn 0.25s ease; }
.page.active { display:block; }
@keyframes fadeIn { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)} }
/* HAMBURGER */
.hamburger { display:none; flex-direction:column; gap:4px; cursor:pointer; padding:4px; }
.hamburger span { display:block; width:20px; height:2px; background:var(--text-primary); border-radius:2px; }
/* RESPONSIVE */
@media(max-width:1200px){ .grid-4{grid-template-columns:repeat(2,1fr)} }
@media(max-width:900px){ .grid-2{grid-template-columns:1fr} .grid-3{grid-template-columns:1fr 1fr} }
@media(max-width:768px){
  .sidebar{transform:translateX(-100%)} .sidebar.open{transform:translateX(0);box-shadow:4px 0 30px rgba(0,0,0,0.6)}
  .main-content{margin-left:0} .hamburger{display:flex} .grid-4{grid-template-columns:1fr 1fr}
  .page-content{padding:16px}
}
@media(max-width:480px){ .grid-4,.grid-2{grid-template-columns:1fr} }
</style>
</head>
<body>

<div class="app-shell">

<!-- ══ SIDEBAR ══ -->
<aside class="sidebar" id="sidebar">
  <div class="sidebar-logo">
    <div class="logo-icon">🌿</div>
    <div class="logo-text">CO₂ Monitor<span>Industrial Emissions Tracking</span></div>
  </div>
  <nav class="sidebar-nav">
    <div class="nav-section-label">Main</div>
    <a class="nav-item active" id="navHome" onclick="navigate('home')" href="#">
      <span class="nav-icon">🏠</span>Home
    </a>
    <a class="nav-item" id="navDashboard" onclick="navigate('dashboard')" href="#">
      <span class="nav-icon">📊</span>Dashboard
    </a>
    <a class="nav-item" id="navReports" onclick="navigate('reports')" href="#">
      <span class="nav-icon">📋</span>Reports
    </a>
    <div class="nav-section-label" style="margin-top:12px">System</div>
    <a class="nav-item" href="#" onclick="event.preventDefault()">
      <span class="nav-icon">⚙️</span>Settings
    </a>
  </nav>
  <div class="sidebar-footer">
    <div class="live-badge">
      <div class="live-dot"></div>
      <div>
        <div style="color:var(--text-primary);font-size:0.72rem">SYSTEM LIVE</div>
        <div id="sidebarClock" style="font-size:0.65rem">—</div>
      </div>
    </div>
    <div style="margin-top:10px;font-size:0.62rem;color:var(--text-muted);line-height:1.5">
      <div>4 Facilities · 4 Sensors</div>
      <div id="sidebarDataCount">— readings loaded</div>
    </div>
  </div>
</aside>

<!-- ══ MAIN ══ -->
<div class="main-content">
  <header class="topbar">
    <div style="display:flex;align-items:center;gap:14px">
      <div class="hamburger" onclick="document.getElementById('sidebar').classList.toggle('open')">
        <span></span><span></span><span></span>
      </div>
      <div>
        <div class="page-title" id="topbarTitle">Home — Present Status</div>
        <div class="page-subtitle" id="topbarSub">INDUSTRIAL CO₂ EMISSIONS MONITORING</div>
      </div>
    </div>
    <div class="topbar-right">
      <div class="topbar-time" id="topbarClock">—</div>
      <span class="badge normal">● ONLINE</span>
    </div>
  </header>
  <main class="page-content" id="pageContent"></main>
</div>
</div>

<!-- ══ PAGE TEMPLATES ══ -->
<template id="tpl-home">
<div id="page-home" class="page active">
  <div id="homeAlertStrip" class="alert-strip" style="display:none">
    <span>⚠</span><span id="homeAlertText"></span>
  </div>
  <div class="grid-4 mb-24">
    <div class="stat-card cyan"><div class="stat-icon">🌍</div><div class="stat-label">Overall Avg CO₂</div><div class="stat-value cyan" id="statAvgCO2">—</div><div class="stat-delta">ppm across all facilities</div></div>
    <div class="stat-card green"><div class="stat-icon">✅</div><div class="stat-label">Normal Readings</div><div class="stat-value green" id="statNormal">—</div><div class="stat-delta">of all readings in safe range</div></div>
    <div class="stat-card orange"><div class="stat-icon">⚠️</div><div class="stat-label">Warning Events</div><div class="stat-value orange" id="statWarning">—</div><div class="stat-delta">over past 12 months</div></div>
    <div class="stat-card red"><div class="stat-icon">🚨</div><div class="stat-label">Danger Events</div><div class="stat-value red" id="statDanger">—</div><div class="stat-delta">exceed safe threshold</div></div>
  </div>
  <div class="section-header mb-24">
    <div><div class="section-title">Facility Status — Live</div><div class="section-meta" id="homeLastUpdate">—</div></div>
    <button class="btn btn-ghost btn-sm" onclick="Home.refresh()">↻ Refresh</button>
  </div>
  <div class="grid-4 mb-28" id="facilityCards"></div>
  <div class="grid-2 mb-24">
    <div class="card">
      <div class="card-header">
        <div><div class="card-title">24-Hour CO₂ Trend</div><div class="card-subtitle">HOURLY AVG — ALL FACILITIES</div></div>
        <select class="form-control" style="width:140px" id="homeTrendFacility" onchange="Home.updateTrendChart()">
          <option value="all">All Facilities</option>
        </select>
      </div>

<!-- ══ ALL JAVASCRIPT ══ -->
<script>
/* ═══════════════════════════════════════════════════
   DATA ENGINE — 1 Year of realistic CO₂ readings
   ═══════════════════════════════════════════════════ */
const CO2_DATA = (() => {
  const FACILITIES = [
    { id:"FAC-001", name:"Steel Plant Alpha",    location:"Zone A", baseLoad:920, peakLoad:1600 },
    { id:"FAC-002", name:"Cement Works Beta",    location:"Zone B", baseLoad:780, peakLoad:1400 },
    { id:"FAC-003", name:"Power Unit Gamma",     location:"Zone C", baseLoad:650, peakLoad:1200 },
    { id:"FAC-004", name:"Chemical Plant Delta", location:"Zone D", baseLoad:500, peakLoad:950  },
  ];
  const THRESHOLDS = { safe:800, warning:1100, danger:1400 };
  const rand    = (lo,hi) => Math.random()*(hi-lo)+lo;
  const randInt = (lo,hi) => Math.round(rand(lo,hi));
  const clamp   = (v,lo,hi) => Math.max(lo,Math.min(hi,v));
  const seasonal = m => [1.15,1.12,1.05,0.95,0.88,0.82,0.80,0.83,0.90,1.00,1.08,1.14][m];
  const shiftMult = h => h>=6&&h<14?1.20:h>=14&&h<22?1.10:0.85;
  const dayMult   = d => (d===0||d===6)?0.72:1.0;

  function generateYear() {
    const rows = [];
    const now   = new Date();
    const start = new Date(now);
    start.setFullYear(now.getFullYear()-1);
    start.setMinutes(0,0,0);
    let cursor = new Date(start), id = 1;
    while(cursor <= now) {
      const m=cursor.getMonth(), d=cursor.getDay(), h=cursor.getHours();
      const sm=seasonal(m), dm=dayMult(d), shm=shiftMult(h);
      FACILITIES.forEach(fac=>{
        const base=fac.baseLoad*sm*dm*shm;
        const jitter=rand(-60,60), spike=Math.random()<0.03?rand(80,200):0;
        const ppm=clamp(Math.round(base+jitter+spike),300,fac.peakLoad+150);
        rows.push({
          id:id++, timestamp:new Date(cursor),
          facilityId:fac.id, facilityName:fac.name, location:fac.location,
          co2_ppm:ppm,
          temperature:parseFloat((rand(18,35)*sm*0.9).toFixed(1)),
          humidity:parseFloat(rand(30,80).toFixed(1)),
          flowRate:parseFloat((rand(80,200)*sm*dm).toFixed(2)),
          status:ppm>=THRESHOLDS.danger?"DANGER":ppm>=THRESHOLDS.warning?"WARNING":"NORMAL"
        });
      });
      cursor.setHours(cursor.getHours()+1);
    }
    return rows;
  }
  function dailyAverages(rows){
    const map={};
    rows.forEach(r=>{
      const day=r.timestamp.toISOString().slice(0,10), key=`${day}|${r.facilityId}`;
      if(!map[key]) map[key]={day,facilityId:r.facilityId,facilityName:r.facilityName,sum:0,count:0};
      map[key].sum+=r.co2_ppm; map[key].count++;
    });
    return Object.values(map).map(o=>({...o,avg:Math.round(o.sum/o.count)})).sort((a,b)=>a.day.localeCompare(b.day));
  }
  function monthlyTotals(rows){
    const map={};
    rows.forEach(r=>{
      const mo=r.timestamp.toISOString().slice(0,7), key=`${mo}|${r.facilityId}`;
      if(!map[key]) map[key]={month:mo,facilityId:r.facilityId,facilityName:r.facilityName,sum:0,count:0,max:0};
      map[key].sum+=r.co2_ppm; map[key].count++;
      if(r.co2_ppm>map[key].max) map[key].max=r.co2_ppm;
    });
    return Object.values(map).map(o=>({...o,avg:Math.round(o.sum/o.count)})).sort((a,b)=>a.month.localeCompare(b.month));
  }
  function latestPerFacility(rows){
    const map={};
    rows.forEach(r=>{ if(!map[r.facilityId]||r.timestamp>map[r.facilityId].timestamp) map[r.facilityId]=r; });
    return Object.values(map);
  }
  function recentHourlyTrend(rows,hours=24){
    const cutoff=new Date(Date.now()-hours*3600000);
    const recent=rows.filter(r=>r.timestamp>=cutoff);
    const byHour={};
    recent.forEach(r=>{ const k=r.timestamp.toISOString().slice(0,13); if(!byHour[k]) byHour[k]={hour:k,sum:0,count:0}; byHour[k].sum+=r.co2_ppm; byHour[k].count++; });
    return Object.values(byHour).map(o=>({hour:o.hour,avg:Math.round(o.sum/o.count)})).sort((a,b)=>a.hour.localeCompare(b.hour));
  }
  function globalStats(rows){
    if(!rows.length) return {};
    const ppms=rows.map(r=>r.co2_ppm), sum=ppms.reduce((a,b)=>a+b,0);
    const dangerCount=rows.filter(r=>r.status==="DANGER").length;
    const warnCount=rows.filter(r=>r.status==="WARNING").length;
    return {
      total:rows.length, avgPPM:Math.round(sum/rows.length),
      minPPM:Math.min(...ppms), maxPPM:Math.max(...ppms),
      dangerPct:((dangerCount/rows.length)*100).toFixed(1),
      warnPct:((warnCount/rows.length)*100).toFixed(1),
      normalPct:(((rows.length-dangerCount-warnCount)/rows.length)*100).toFixed(1),
    };
  }
  console.time("CO2 data generation");
  const ALL_ROWS = generateYear();
  console.timeEnd("CO2 data generation");
  const _daily=dailyAverages(ALL_ROWS), _monthly=monthlyTotals(ALL_ROWS),
        _latest=latestPerFacility(ALL_ROWS), _stats=globalStats(ALL_ROWS);
  return {
    ALL_ROWS, FACILITIES, THRESHOLDS,
    dailyAverages:()=>_daily, monthlyTotals:()=>_monthly,
    latestPerFacility:()=>_latest, globalStats:()=>_stats,
    recentHourlyTrend:(h)=>recentHourlyTrend(ALL_ROWS,h),
    filterRows(opts={}){
      let r=ALL_ROWS;
      if(opts.facilityId) r=r.filter(x=>x.facilityId===opts.facilityId);
      if(opts.status)     r=r.filter(x=>x.status===opts.status);
      if(opts.dateFrom)   r=r.filter(x=>x.timestamp>=new Date(opts.dateFrom));
      if(opts.dateTo){const to=new Date(opts.dateTo);to.setHours(23,59,59);r=r.filter(x=>x.timestamp<=to);}
      if(opts.minPPM!==undefined) r=r.filter(x=>x.co2_ppm>=opts.minPPM);
      if(opts.maxPPM!==undefined) r=r.filter(x=>x.co2_ppm<=opts.maxPPM);
      return r;
    }
  };
})();

/* ═══════════════════════════════════════════════════
   APEX CHART HELPERS
   ═══════════════════════════════════════════════════ */
const COLORS = ['#00d4ff','#00ff9d','#ff8c42','#ffd166'];
const APEX_DARK = {
  chart:{ background:'transparent' },
  grid:{ borderColor:'#1e2d3d', strokeDashArray:3 },
  tooltip:{ theme:'dark' },
  theme:{ mode:'dark' },
  legend:{ labels:{ colors:'#7a92a8' }, fontFamily:'DM Sans' },
};
const AXIS_STYLE = { labels:{ style:{ colors:'#7a92a8', fontFamily:'Space Mono', fontSize:'10px' } } };
const ALL_CHARTS = {};

function makeChart(id, opts) {
  if(ALL_CHARTS[id]) { ALL_CHARTS[id].destroy(); delete ALL_CHARTS[id]; }
  const el = document.getElementById(id);
  if(!el) return null;
  const c = new ApexCharts(el, opts);
  c.render();
  ALL_CHARTS[id] = c;
  return c;
}

/* ═══════════════════════════════════════════════════
   HOME PAGE CONTROLLER
   ═══════════════════════════════════════════════════ */
const Home = (() => {
  function renderFacilityCards(){
    const latest=CO2_DATA.latestPerFacility(), wrap=document.getElementById('facilityCards');
    if(!wrap) return;
    let html='', dangerFacs=[];
    latest.forEach(r=>{
      const pct=Math.min(100,Math.round((r.co2_ppm/1600)*100));
      const bc=r.status==='DANGER'?'var(--status-danger)':r.status==='WARNING'?'var(--status-warning)':'var(--status-normal)';
      if(r.status==='DANGER') dangerFacs.push(r.facilityName);
      html+=`<div class="facility-card status-${r.status}">
        <div class="facility-header">
          <div><div class="facility-name">${r.facilityName}</div><div class="facility-loc">📍 ${r.location}</div></div>
          <span class="badge ${r.status.toLowerCase()}">${r.status}</span>
        </div>
        <div class="facility-ppm ${r.status}">${r.co2_ppm.toLocaleString()}</div>
        <div class="facility-sub">ppm CO₂</div>
        <div class="progress-bar-wrap"><div class="progress-bar-fill" style="width:${pct}%;background:${bc}"></div></div>
        <div class="mini-stats">
          <div class="mini-stat"><div class="mini-stat-label">Temp</div><div class="mini-stat-val">${r.temperature}°C</div></div>
          <div class="mini-stat"><div class="mini-stat-label">Humidity</div><div class="mini-stat-val">${r.humidity}%</div></div>
          <div class="mini-stat"><div class="mini-stat-label">Flow Rate</div><div class="mini-stat-val">${r.flowRate} m³/h</div></div>
          <div class="mini-stat"><div class="mini-stat-label">Sensor ID</div><div class="mini-stat-val">${r.facilityId}</div></div>
        </div>
      </div>`;
    });
    wrap.innerHTML=html;
    const strip=document.getElementById('homeAlertStrip');
    if(dangerFacs.length){ document.getElementById('homeAlertText').textContent=`Critical CO₂: ${dangerFacs.join(', ')}. Immediate action!`; strip.style.display='flex'; }
    else strip.style.display='none';
    document.getElementById('homeLastUpdate').textContent=`Last updated: ${new Date().toLocaleTimeString()}`;
  }

  function renderStatCards(){
    const s=CO2_DATA.globalStats();
    document.getElementById('statAvgCO2').textContent=s.avgPPM?.toLocaleString()+' ppm';
    document.getElementById('statNormal').textContent=s.normalPct+'%';
    document.getElementById('statWarning').textContent=s.warnPct+'%';
    document.getElementById('statDanger').textContent=s.dangerPct+'%';
  }

  function renderTrendChart(){
    const trend=CO2_DATA.recentHourlyTrend(24);
    makeChart('chartTrend24h',{
      ...APEX_DARK,
      chart:{...APEX_DARK.chart,type:'area',height:240,toolbar:{show:false}},
      series:[{name:'Avg CO₂ ppm',data:trend.map(r=>r.avg)}],
      xaxis:{categories:trend.map(r=>r.hour.slice(11)),...AXIS_STYLE},
      yaxis:AXIS_STYLE, stroke:{curve:'smooth',width:2},
      fill:{type:'gradient',gradient:{opacityFrom:0.35,opacityTo:0.02}},
      colors:['#00d4ff'], dataLabels:{enabled:false},
      annotations:{yaxis:[
        {y:800,borderColor:'#f59e0b',label:{text:'WARNING',style:{color:'#f59e0b',background:'transparent',fontFamily:'Space Mono',fontSize:'9px'}}},
        {y:1100,borderColor:'#ef4444',label:{text:'DANGER',style:{color:'#ef4444',background:'transparent',fontFamily:'Space Mono',fontSize:'9px'}}},
      ]},
    });
    const sel=document.getElementById('homeTrendFacility');
    if(sel&&sel.options.length===1) CO2_DATA.FACILITIES.forEach(f=>sel.appendChild(new Option(f.name,f.id)));
  }

  function renderPieChart(){
    const s=CO2_DATA.globalStats();
    makeChart('chartStatusPie',{
      ...APEX_DARK,
      chart:{...APEX_DARK.chart,type:'donut',height:240},
      series:[parseFloat(s.normalPct),parseFloat(s.warnPct),parseFloat(s.dangerPct)],
      labels:['Normal','Warning','Danger'], colors:['#22c55e','#f59e0b','#ef4444'],
      legend:{position:'bottom',labels:{colors:'#7a92a8'}},
      dataLabels:{style:{fontFamily:'Space Mono',fontSize:'11px'}},
      plotOptions:{pie:{donut:{size:'60%',labels:{show:true,total:{show:true,label:'Total',color:'#7a92a8',fontFamily:'Space Mono'}}}}},
    });
  }

  function renderMonthlyChart(){
    const monthly=CO2_DATA.monthlyTotals();
    const months=[...new Set(monthly.map(r=>r.month))].sort();
    const series=CO2_DATA.FACILITIES.map(fac=>({
      name:fac.name,
      data:months.map(m=>{ const f=monthly.find(r=>r.month===m&&r.facilityId===fac.id); return f?f.avg:null; })
    }));
    makeChart('chartMonthly',{
      ...APEX_DARK,
      chart:{...APEX_DARK.chart,type:'line',height:280,toolbar:{show:true}},
      series, xaxis:{categories:months,...AXIS_STYLE},
      yaxis:{title:{text:'Avg CO₂ ppm',style:{color:'#7a92a8',fontFamily:'Space Mono'}},...AXIS_STYLE},
      stroke:{curve:'smooth',width:2.5}, colors:COLORS, markers:{size:3},
      legend:{position:'top',labels:{colors:'#7a92a8'}},
      annotations:{yaxis:[
        {y:800,borderColor:'#f59e0b44',label:{text:'Warning Zone',style:{color:'#f59e0b',background:'#f59e0b22',fontFamily:'Space Mono',fontSize:'9px'}}},
        {y:1100,borderColor:'#ef444444',label:{text:'Danger Zone',style:{color:'#ef4444',background:'#ef444422',fontFamily:'Space Mono',fontSize:'9px'}}},
      ]},
    });
  }

  function updateTrendChart(){
    const facId=document.getElementById('homeTrendFacility')?.value;
    let rows=CO2_DATA.ALL_ROWS;
    if(facId&&facId!=='all') rows=rows.filter(r=>r.facilityId===facId);
    const cutoff=new Date(Date.now()-24*3600000);
    const recent=rows.filter(r=>r.timestamp>=cutoff);
    const byHour={};
    recent.forEach(r=>{ const k=r.timestamp.toISOString().slice(0,13); if(!byHour[k]) byHour[k]={sum:0,count:0}; byHour[k].sum+=r.co2_ppm; byHour[k].count++; });
    const trend=Object.entries(byHour).sort(([a],[b])=>a.localeCompare(b)).map(([h,v])=>({hour:h,avg:Math.round(v.sum/v.count)}));
    if(ALL_CHARTS['chartTrend24h']){
      ALL_CHARTS['chartTrend24h'].updateSeries([{name:'Avg CO₂ ppm',data:trend.map(r=>r.avg)}]);
      ALL_CHARTS['chartTrend24h'].updateOptions({xaxis:{categories:trend.map(r=>r.hour.slice(11))}});
    }
  }

  function init(){
    renderStatCards(); renderFacilityCards(); renderTrendChart(); renderPieChart(); renderMonthlyChart();
  }

  return { init, refresh:()=>{ renderFacilityCards(); renderStatCards(); }, updateTrendChart };
})();

/* ═══════════════════════════════════════════════════
   DASHBOARD PAGE CONTROLLER
   ═══════════════════════════════════════════════════ */
const Dashboard = (() => {
  const DAYS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  let activeFacs=new Set(CO2_DATA.FACILITIES.map(f=>f.id));

  function init(){
    renderStatCards(); renderAreaYear();
    initSelects(); renderBarMonthly(); renderRadial();
    renderHeatmap(); renderStackedAlerts(); renderScatter(); renderFlow();
  }

  function renderStatCards(){
    const s=CO2_DATA.globalStats();
    document.getElementById('dbTotalReadings').textContent=s.total?.toLocaleString();
    document.getElementById('dbMinCO2').textContent=s.minPPM+' ppm';
    document.getElementById('dbMaxCO2').textContent=s.maxPPM+' ppm';
    document.getElementById('dbAvgCO2').textContent=s.avgPPM+' ppm';
  }

  function renderAreaYear(){
    const daily=CO2_DATA.dailyAverages();
    const days=[...new Set(daily.map(r=>r.day))].sort();
    const wrap=document.getElementById('dashFacFilter');
    if(wrap&&!wrap.children.length){
      CO2_DATA.FACILITIES.forEach((f,i)=>{
        const btn=document.createElement('button');
        btn.className='btn btn-ghost btn-sm';
        btn.style.cssText=`color:${COLORS[i]};border-color:${COLORS[i]}44;font-family:var(--font-mono);font-size:0.65rem`;
        btn.textContent=f.id; btn.dataset.fac=f.id; btn.dataset.active='true';
        btn.onclick=()=>{ if(activeFacs.has(f.id)){activeFacs.delete(f.id);btn.style.opacity='0.35';}else{activeFacs.add(f.id);btn.style.opacity='1';} renderAreaYear(); };
        wrap.appendChild(btn);
      });
    }
    const series=CO2_DATA.FACILITIES.filter(f=>activeFacs.has(f.id)).map((f,i)=>({
      name:f.name,
      data:days.map(d=>{ const found=daily.find(r=>r.day===d&&r.facilityId===f.id); return found?found.avg:null; })
    }));
    makeChart('chartAreaYear',{
      ...APEX_DARK,
      chart:{...APEX_DARK.chart,type:'area',height:320,toolbar:{show:true,tools:{download:true,zoom:true,pan:true,reset:true}}},
      series, xaxis:{categories:days,type:'datetime',tickAmount:12,...AXIS_STYLE},
      yaxis:{title:{text:'CO₂ ppm',style:{color:'#7a92a8',fontFamily:'Space Mono'}},...AXIS_STYLE},
      stroke:{curve:'smooth',width:2}, fill:{type:'gradient',gradient:{opacityFrom:0.25,opacityTo:0.0}},
      colors:COLORS, dataLabels:{enabled:false}, markers:{size:0},
      annotations:{yaxis:[
        {y:800,borderColor:'#f59e0b',strokeDashArray:4,label:{text:'WARNING',style:{color:'#f59e0b',background:'transparent',fontFamily:'Space Mono',fontSize:'9px'}}},
        {y:1100,borderColor:'#ef4444',strokeDashArray:4,label:{text:'DANGER',style:{color:'#ef4444',background:'transparent',fontFamily:'Space Mono',fontSize:'9px'}}},
      ]},
    });
  }
  function updateAreaYear(){ renderAreaYear(); }

  function initSelects(){
    const monthly=CO2_DATA.monthlyTotals();
    const months=[...new Set(monthly.map(r=>r.month))].sort().reverse();
    const barSel=document.getElementById('barMonthSel');
    if(barSel&&!barSel.options.length) months.forEach(m=>barSel.appendChild(new Option(m,m)));
    const heatSel=document.getElementById('heatFacSel');
    if(heatSel&&!heatSel.options.length) CO2_DATA.FACILITIES.forEach(f=>heatSel.appendChild(new Option(f.name,f.id)));
    const scatSel=document.getElementById('scatterFacSel');
    if(scatSel&&!scatSel.options.length) CO2_DATA.FACILITIES.forEach(f=>scatSel.appendChild(new Option(f.name,f.id)));
    const flowSel=document.getElementById('flowMonthSel');
    if(flowSel&&!flowSel.options.length) months.forEach(m=>flowSel.appendChild(new Option(m,m)));
  }

  function renderBarMonthly(){
    const m=document.getElementById('barMonthSel')?.value;
    if(!m) return;
    const monthly=CO2_DATA.monthlyTotals();
    const data=CO2_DATA.FACILITIES.map(f=>{ const found=monthly.find(r=>r.month===m&&r.facilityId===f.id); return found?found.avg:0; });
    makeChart('chartBarMonthly',{
      ...APEX_DARK,
      chart:{...APEX_DARK.chart,type:'bar',height:280,toolbar:{show:false}},
      series:[{name:'Avg CO₂ (ppm)',data}],
      xaxis:{categories:CO2_DATA.FACILITIES.map(f=>f.name.split(' ').slice(0,2).join(' ')),...AXIS_STYLE},
      yaxis:AXIS_STYLE, colors:COLORS,
      plotOptions:{bar:{borderRadius:5,distributed:true}},
      dataLabels:{enabled:true,formatter:v=>v+' ppm',style:{fontFamily:'Space Mono',fontSize:'10px',colors:['#000']}},
      legend:{show:false},
    });
  }
  function updateBar(){ renderBarMonthly(); }

  function renderRadial(){
    const latest=CO2_DATA.latestPerFacility().slice(0,4);
    const THRESHOLD=1600;
    makeChart('chartRadial',{
      ...APEX_DARK,
      chart:{...APEX_DARK.chart,type:'radialBar',height:260},
      series:latest.map(r=>Math.round((r.co2_ppm/THRESHOLD)*100)),
      labels:latest.map(r=>r.facilityId),
      colors:['#22c55e','#f59e0b','#00d4ff','#ffd166'],
      plotOptions:{radialBar:{hollow:{size:'20%',background:'transparent'},track:{background:'#1e2d3d'},
        dataLabels:{name:{color:'#7a92a8',fontSize:'10px',fontFamily:'Space Mono'},
          value:{color:'#e8edf2',fontSize:'13px',fontFamily:'Space Mono',formatter:v=>Math.round(v*THRESHOLD/100)+' ppm'}}}},
    });
    const labelWrap=document.getElementById('radialLabels');
    if(labelWrap) labelWrap.innerHTML=latest.map((r,i)=>`
      <div style="text-align:center">
        <div style="font-family:var(--font-mono);font-size:1rem;color:${COLORS[i]}">${r.co2_ppm}</div>
        <div style="font-size:0.6rem;color:var(--text-muted);font-family:var(--font-mono)">${r.facilityId}</div>
      </div>`).join('');
  }

  function renderHeatmap(facId){
    const fid=facId||document.getElementById('heatFacSel')?.value||CO2_DATA.FACILITIES[0].id;
    const rows=CO2_DATA.ALL_ROWS.filter(r=>r.facilityId===fid);
    const heatMatrix={};
    rows.forEach(r=>{ const h=r.timestamp.getHours(), d=r.timestamp.getDay();
      if(!heatMatrix[h]) heatMatrix[h]={}; if(!heatMatrix[h][d]) heatMatrix[h][d]=[];
      heatMatrix[h][d].push(r.co2_ppm); });
    const series=[];
    for(let h=23;h>=0;h--){
      const data=DAYS.map((day,di)=>{ const arr=heatMatrix[h]?.[di]||[]; return arr.length?Math.round(arr.reduce((a,b)=>a+b,0)/arr.length):0; });
      series.push({name:`${String(h).padStart(2,'0')}:00`,data});
    }
    makeChart('chartHeatmap',{
      ...APEX_DARK,
      chart:{...APEX_DARK.chart,type:'heatmap',height:260,toolbar:{show:false}},
      series, xaxis:{categories:DAYS,...AXIS_STYLE}, yaxis:AXIS_STYLE,
      dataLabels:{enabled:false},
      plotOptions:{heatmap:{shadeIntensity:0.8,colorScale:{ranges:[
        {from:0,to:799,color:'#22c55e',name:'Normal'},
        {from:800,to:1099,color:'#f59e0b',name:'Warning'},
        {from:1100,to:2000,color:'#ef4444',name:'Danger'},
      ]}}},
    });
  }
  function updateHeatmap(){ renderHeatmap(document.getElementById('heatFacSel')?.value); }

  function renderStackedAlerts(){
    const monthly=CO2_DATA.monthlyTotals();
    const months=[...new Set(monthly.map(r=>r.month))].sort();
    const byMonth={};
    months.forEach(m=>{ byMonth[m]={NORMAL:0,WARNING:0,DANGER:0}; });
    CO2_DATA.ALL_ROWS.forEach(r=>{ const m=r.timestamp.toISOString().slice(0,7); if(byMonth[m]) byMonth[m][r.status]++; });
    makeChart('chartStackedAlerts',{
      ...APEX_DARK,
      chart:{...APEX_DARK.chart,type:'bar',height:260,stacked:true,stackType:'100%',toolbar:{show:false}},
      series:[
        {name:'Normal',data:months.map(m=>byMonth[m].NORMAL)},
        {name:'Warning',data:months.map(m=>byMonth[m].WARNING)},
        {name:'Danger',data:months.map(m=>byMonth[m].DANGER)},
      ],
      xaxis:{categories:months,...AXIS_STYLE},
      yaxis:{labels:{formatter:v=>v+'%',...AXIS_STYLE.labels}},
      colors:['#22c55e','#f59e0b','#ef4444'],
      dataLabels:{enabled:false}, fill:{opacity:1},
    });
  }

  function renderScatter(facId){
    const fid=facId||document.getElementById('scatterFacSel')?.value||CO2_DATA.FACILITIES[0].id;
    const rows=CO2_DATA.ALL_ROWS.filter(r=>r.facilityId===fid);
    const step=Math.max(1,Math.floor(rows.length/400));
    const sampled=rows.filter((_,i)=>i%step===0).slice(0,400);
    const byStatus={NORMAL:[],WARNING:[],DANGER:[]};
    sampled.forEach(r=>byStatus[r.status].push([r.temperature,r.co2_ppm]));
    makeChart('chartScatter',{
      ...APEX_DARK,
      chart:{...APEX_DARK.chart,type:'scatter',height:260,toolbar:{show:false},zoom:{enabled:false}},
      series:[{name:'Normal',data:byStatus.NORMAL},{name:'Warning',data:byStatus.WARNING},{name:'Danger',data:byStatus.DANGER}],
      xaxis:{title:{text:'Temperature °C',style:{color:'#7a92a8',fontFamily:'Space Mono'}},...AXIS_STYLE},
      yaxis:{title:{text:'CO₂ ppm',style:{color:'#7a92a8',fontFamily:'Space Mono'}},...AXIS_STYLE},
      colors:['#22c55e','#f59e0b','#ef4444'], markers:{size:3.5}, dataLabels:{enabled:false},
    });
  }
  function updateScatter(){ renderScatter(document.getElementById('scatterFacSel')?.value); }

  function renderFlow(){
    const m=document.getElementById('flowMonthSel')?.value;
    if(!m) return;
    const rows=CO2_DATA.ALL_ROWS.filter(r=>r.timestamp.toISOString().slice(0,7)===m);
    const byFac={};
    CO2_DATA.FACILITIES.forEach(f=>{ byFac[f.id]={sum:0,count:0}; });
    rows.forEach(r=>{ if(byFac[r.facilityId]){ byFac[r.facilityId].sum+=r.flowRate; byFac[r.facilityId].count++; } });
    const data=CO2_DATA.FACILITIES.map(f=>parseFloat((byFac[f.id].sum/(byFac[f.id].count||1)).toFixed(1)));
    makeChart('chartFlow',{
      ...APEX_DARK,
      chart:{...APEX_DARK.chart,type:'bar',height:260,toolbar:{show:false}},
      series:[{name:'Avg Flow Rate (m³/h)',data}],
      xaxis:{categories:CO2_DATA.FACILITIES.map(f=>f.name.split(' ')[0]),...AXIS_STYLE},
      yaxis:{title:{text:'m³/h',style:{color:'#7a92a8',fontFamily:'Space Mono'}},...AXIS_STYLE},
      colors:COLORS, plotOptions:{bar:{borderRadius:4,distributed:true}},
      dataLabels:{enabled:true,formatter:v=>v+' m³/h',style:{fontFamily:'Space Mono',fontSize:'10px',colors:['#000']}},
      legend:{show:false},
    });
  }
  function updateFlow(){ renderFlow(); }

  return { init, updateAreaYear, updateBar, updateHeatmap, updateScatter, updateFlow };
})();

/* ═══════════════════════════════════════════════════
   REPORTS PAGE CONTROLLERhkhkhkhmh
   ═══════════════════════════════════════════════════ */
const Reports = (() => {
  const PER_PAGE=50;
  let filteredRows=[], currentPage=1, sortCol='timestamp', sortDir='desc';
  const rptCharts={};

  function init(){
    const facSel=document.getElementById('rptFacility');
    if(facSel&&facSel.options.length===1) CO2_DATA.FACILITIES.forEach(f=>facSel.appendChild(new Option(f.name,f.id)));
    const now=new Date(), start=new Date(now);
    start.setFullYear(now.getFullYear()-1);
    const fmt=d=>d.toISOString().slice(0,10);
    const fromEl=document.getElementById('rptDateFrom');
    const toEl=document.getElementById('rptDateTo');
    if(fromEl) fromEl.value=fmt(start);
    if(toEl) toEl.value=fmt(now);
    apply();
  }

  function apply(){
    filteredRows=CO2_DATA.filterRows({
      facilityId:document.getElementById('rptFacility')?.value||undefined,
      status:document.getElementById('rptStatus')?.value||undefined,
      dateFrom:document.getElementById('rptDateFrom')?.value||undefined,
      dateTo:document.getElementById('rptDateTo')?.value||undefined,
      minPPM:document.getElementById('rptMinPPM')?.value?parseInt(document.getElementById('rptMinPPM').value):undefined,
      maxPPM:document.getElementById('rptMaxPPM')?.value?parseInt(document.getElementById('rptMaxPPM').value):undefined,
    });
    currentPage=1; sortRows(); renderSummary(); renderTable(); renderPagination(); renderMiniCharts();
  }

  function reset(){
    ['rptFacility','rptStatus','rptMinPPM','rptMaxPPM'].forEach(id=>{ const el=document.getElementById(id); if(el) el.value=''; });
    const now=new Date(), start=new Date(now); start.setFullYear(now.getFullYear()-1);
    document.getElementById('rptDateFrom').value=start.toISOString().slice(0,10);
    document.getElementById('rptDateTo').value=now.toISOString().slice(0,10);
    apply();
  }

  function sort(col){
    if(sortCol===col) sortDir=sortDir==='asc'?'desc':'asc';
    else { sortCol=col; sortDir='asc'; }
    document.querySelectorAll('#rptTable th').forEach(th=>{
      th.classList.remove('sort-asc','sort-desc');
      if(th.dataset.col===col) th.classList.add(sortDir==='asc'?'sort-asc':'sort-desc');
    });
    currentPage=1; sortRows(); renderTable(); renderPagination();
  }

  function sortRows(){
    filteredRows.sort((a,b)=>{
      let av=a[sortCol], bv=b[sortCol];
      if(av instanceof Date) { av=av.getTime(); bv=bv.getTime(); }
      if(typeof av==='string') return sortDir==='asc'?av.localeCompare(bv):bv.localeCompare(av);
      return sortDir==='asc'?av-bv:bv-av;
    });
  }

  function renderSummary(){
    const count=filteredRows.length;
    document.getElementById('rptCount').textContent=count.toLocaleString();
    if(!count){ document.getElementById('rptAvgPPM').textContent='—'; document.getElementById('rptMaxPPMStat').textContent='—'; return; }
    const sum=filteredRows.reduce((a,r)=>a+r.co2_ppm,0);
    document.getElementById('rptAvgPPM').textContent=Math.round(sum/count).toLocaleString();
    document.getElementById('rptMaxPPMStat').textContent=Math.max(...filteredRows.map(r=>r.co2_ppm)).toLocaleString();
  }

  function renderTable(){
    const tbody=document.getElementById('rptTableBody');
    if(!tbody) return;
    if(!filteredRows.length){ tbody.innerHTML=`<tr><td colspan="9" style="text-align:center;padding:40px;color:var(--text-muted)">No records match filters.</td></tr>`; return; }
    const start=(currentPage-1)*PER_PAGE;
    const page=filteredRows.slice(start,start+PER_PAGE);
    tbody.innerHTML=page.map((r,idx)=>{
      const ppmColor=r.status==='DANGER'?'var(--status-danger)':r.status==='WARNING'?'var(--status-warning)':'var(--status-normal)';
      const ts=r.timestamp;
      const ds=`${ts.getFullYear()}-${String(ts.getMonth()+1).padStart(2,'0')}-${String(ts.getDate()).padStart(2,'0')}`;
      const tss=`${String(ts.getHours()).padStart(2,'0')}:${String(ts.getMinutes()).padStart(2,'0')}`;
      return `<tr>
        <td class="mono" style="color:var(--text-muted)">${start+idx+1}</td>
        <td class="mono">${ds} <span style="color:var(--text-muted)">${tss}</span></td>
        <td style="color:var(--text-primary);font-weight:500">${r.facilityName}</td>
        <td style="color:var(--text-muted)">${r.location}</td>
        <td style="font-family:var(--font-mono);font-weight:700;color:${ppmColor}">${r.co2_ppm.toLocaleString()}</td>
        <td class="mono">${r.temperature}</td>
        <td class="mono">${r.humidity}</td>
        <td class="mono">${r.flowRate}</td>
        <td><span class="badge ${r.status.toLowerCase()}">${r.status}</span></td>
      </tr>`;
    }).join('');
  }

  function renderPagination(){
    const total=Math.ceil(filteredRows.length/PER_PAGE)||1;
    document.getElementById('rptPageNum').textContent=currentPage;
    document.getElementById('rptPageTotal').textContent=total;
    const wrap=document.getElementById('rptPagination');
    if(!wrap) return;
    const pages=[];
    pages.push({label:'‹',val:currentPage-1,disabled:currentPage<=1});
    let lo=Math.max(1,currentPage-2), hi=Math.min(total,lo+4);
    lo=Math.max(1,hi-4);
    if(lo>1) pages.push({label:'1',val:1});
    if(lo>2) pages.push({label:'…',val:null});
    for(let i=lo;i<=hi;i++) pages.push({label:String(i),val:i,active:i===currentPage});
    if(hi<total-1) pages.push({label:'…',val:null});
    if(hi<total) pages.push({label:String(total),val:total});
    pages.push({label:'›',val:currentPage+1,disabled:currentPage>=total});
    wrap.innerHTML=pages.map(p=>{
      if(p.val===null) return `<span class="pg-btn" style="cursor:default;pointer-events:none">…</span>`;
      return `<button class="pg-btn ${p.active?'active':''}" ${p.disabled?'disabled':''} onclick="Reports.goPage(${p.val})">${p.label}</button>`;
    }).join('');
  }

  function goPage(n){
    const total=Math.ceil(filteredRows.length/PER_PAGE);
    if(n<1||n>total) return;
    currentPage=n; renderTable(); renderPagination();
    document.getElementById('rptTableWrap')?.scrollIntoView({behavior:'smooth',block:'start'});
  }

  function renderMiniCharts(){
    if(!filteredRows.length) return;
    // Histogram
    const BINS=[400,500,600,700,800,900,1000,1100,1200,1300,1400,1500,1600];
    const counts=BINS.map((lo,i)=>{ const hi=BINS[i+1]||9999; return filteredRows.filter(r=>r.co2_ppm>=lo&&r.co2_ppm<hi).length; });
    const labels=BINS.map((b,i)=>BINS[i+1]?`${b}-${BINS[i+1]}`:`${b}+`);
    const histColors=BINS.map(b=>b>=1100?'#ef4444':b>=800?'#f59e0b':'#22c55e');
    makeChart('chartRptHistogram',{
      ...APEX_DARK,
      chart:{...APEX_DARK.chart,type:'bar',height:220,toolbar:{show:false}},
      series:[{name:'Count',data:counts}],
      xaxis:{categories:labels,labels:{rotate:-40,style:{colors:'#7a92a8',fontFamily:'Space Mono',fontSize:'9px'}}},
      yaxis:AXIS_STYLE, colors:[({dataPointIndex:i})=>histColors[i]||'#00d4ff'],
      plotOptions:{bar:{borderRadius:2,distributed:true}},
      dataLabels:{enabled:false}, legend:{show:false},
    });
    // Timeline
    const byDay={};
    filteredRows.forEach(r=>{ const d=r.timestamp.toISOString().slice(0,10); if(!byDay[d]) byDay[d]={sum:0,count:0}; byDay[d].sum+=r.co2_ppm; byDay[d].count++; });
    const days=Object.keys(byDay).sort();
    const step=Math.max(1,Math.floor(days.length/90));
    const sampled=days.filter((_,i)=>i%step===0);
    const data=sampled.map(d=>Math.round(byDay[d].sum/byDay[d].count));
    makeChart('chartRptTimeline',{
      ...APEX_DARK,
      chart:{...APEX_DARK.chart,type:'line',height:220,toolbar:{show:false}},
      series:[{name:'Avg CO₂',data}],
      xaxis:{categories:sampled,tickAmount:6,...AXIS_STYLE}, yaxis:AXIS_STYLE,
      stroke:{curve:'smooth',width:2}, colors:['#00d4ff'],
      fill:{type:'gradient',gradient:{opacityFrom:0.25,opacityTo:0.0}},
      dataLabels:{enabled:false}, markers:{size:0},
      annotations:{yaxis:[{y:800,borderColor:'#f59e0b44'},{y:1100,borderColor:'#ef444444'}]},
    });
  }

  function exportCSV(){
    const headers=['#','Timestamp','Facility','Location','CO2 (ppm)','Temperature','Humidity','Flow Rate','Status'];
    const rows=filteredRows.map((r,i)=>[i+1,r.timestamp.toISOString(),r.facilityName,r.location,r.co2_ppm,r.temperature,r.humidity,r.flowRate,r.status]);
    const csv=[headers,...rows].map(r=>r.map(v=>`"${v}"`).join(',')).join('\n');
    const blob=new Blob([csv],{type:'text/csv'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url; a.download=`co2_report_${new Date().toISOString().slice(0,10)}.csv`; a.click();
    URL.revokeObjectURL(url);
  }

  return { init, apply, reset, sort, goPage, exportCSV };
})();

/* ═══════════════════════════════════════════════════
   APP SHELL — Navigation
   ═══════════════════════════════════════════════════ */
const PAGES = {
  home:      { tpl:'tpl-home',      title:'Home — Present Status',       sub:'LIVE INDUSTRIAL CO₂ EMISSIONS STATUS',    navId:'navHome',      ctrl:Home },
  dashboard: { tpl:'tpl-dashboard', title:'Dashboard — Analytics',        sub:'FULL-YEAR APEXCHARTS ANALYTICS',           navId:'navDashboard', ctrl:Dashboard },
  reports:   { tpl:'tpl-reports',   title:'Reports — Historical Records', sub:'FILTER & EXPORT PREVIOUS READINGS',        navId:'navReports',   ctrl:Reports },
};
let currentPage=null, initedPages=new Set();

function navigate(pageId){
  if(pageId===currentPage) return;
  currentPage=pageId;
  const cfg=PAGES[pageId];
  document.querySelectorAll('.nav-item').forEach(el=>el.classList.remove('active'));
  document.getElementById(cfg.navId)?.classList.add('active');
  document.getElementById('topbarTitle').textContent=cfg.title;
  document.getElementById('topbarSub').textContent=cfg.sub;
  const tpl=document.getElementById(cfg.tpl);
  const content=document.getElementById('pageContent');
  content.innerHTML = tpl ? tpl.innerHTML : `<div style="padding:40px;color:var(--text-muted)">Page template not found.</div>`;
  if(!initedPages.has(pageId)){
    initedPages.add(pageId);
    try { if(cfg.ctrl?.init) cfg.ctrl.init(); } catch(e){ console.error(e); }
  }
  document.getElementById('sidebar')?.classList.remove('open');
  window.scrollTo({top:0,behavior:'smooth'});
}

// Clock
function updateClock(){
  const now=new Date();
  document.getElementById('topbarClock').textContent=now.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',second:'2-digit'});
  document.getElementById('sidebarClock').textContent=now.toLocaleDateString([],{weekday:'short',day:'numeric',month:'short'});
}
setInterval(updateClock,1000); updateClock();

document.addEventListener('DOMContentLoaded',()=>{
  document.getElementById('sidebarDataCount').textContent=`${CO2_DATA.ALL_ROWS.length.toLocaleString()} readings loaded`;
  navigate('home');
});
</script>
</body>
</html>
